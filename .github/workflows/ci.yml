name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    name: CLI and generated applications
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run verify:generated

  release:
    name: Publish GitHub Release
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Check release tag matches package version
        run: |
          VERSION=$(bun -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - run: bun install --frozen-lockfile
      - run: bun run pack
      - name: Create release with bundled CLI
        run: gh release create "$GITHUB_REF_NAME" packages/cli/nexus.tgz --verify-tag --generate-notes --title "Nexus $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
